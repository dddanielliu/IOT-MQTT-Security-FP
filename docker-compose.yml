services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # Simulated sensor: publishes a temperature reading every second.
  sensor:
    image: eclipse-mosquitto:2
    depends_on: [mosquitto]
    env_file: .env
    environment:
      BROKER: mosquitto
      SENSOR_USER: sensor
    entrypoint: ["sh", "/sim/sensor-sim.sh"]
    volumes:
      - ./scripts:/sim:ro
      - ./mosquitto/config/certs/ca.crt:/certs/ca.crt:ro
    restart: unless-stopped

  # Receives the sensor's messages. Output appears in `docker compose logs monitor`.
  monitor:
    image: eclipse-mosquitto:2
    depends_on: [mosquitto]
    env_file: .env
    volumes:
      - ./mosquitto/config/certs/ca.crt:/certs/ca.crt:ro
    entrypoint: ["sh", "-c", "mosquitto_sub -h mosquitto -p 8883 --cafile /certs/ca.crt -u monitor -P \"$$MONITOR_PW\" -t factory/machine1/temperature -v"]
    restart: unless-stopped

  # Simulated actuator (direction B). GUARD=on runs the app-layer checks, GUARD=off is the baseline.
  device:
    build: ./services
    image: iot-mqtt-app:local
    depends_on: [mosquitto]
    env_file: .env
    environment:
      GUARD: ${GUARD:-on}
    volumes:
      - ./mosquitto/config/certs/ca.crt:/certs/ca.crt:ro
      - ./experiments:/out
    command: ["python", "-u", "device.py"]
    restart: unless-stopped

  # Benign controller: reads temperature, publishes setpoint and fan commands over TLS.
  controller:
    build: ./services
    image: iot-mqtt-app:local
    depends_on: [mosquitto]
    env_file: .env
    volumes:
      - ./mosquitto/config/certs/ca.crt:/certs/ca.crt:ro
      - ./experiments:/out
    command: ["python", "-u", "controller.py"]
    restart: unless-stopped

  # Attacker (direction B). Uses the controller's stolen credentials. Only starts with --profile attack.
  attacker:
    build: ./services
    image: iot-mqtt-app:local
    profiles: [attack]
    depends_on: [mosquitto]
    env_file: .env
    volumes:
      - ./mosquitto/config/certs/ca.crt:/certs/ca.crt:ro
      - ./experiments:/out
    command: ["python", "-u", "attacker.py"]
